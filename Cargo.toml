[workspace]
resolver = "3"
members = [
    "crates/wde-core",
    "crates/wde-compositor",
    "crates/wde-panel",
    "crates/wde-launcher",
    "crates/wde-session",
    "crates/wde-settings",
    "crates/wde-theme",
    "crates/wde-protocols",
    "crates/wde-common",
    "crates/wde-display",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MPL-2.0"
repository = "https://github.com/Waizusora/WDE"
