name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout pinned Wicofe dependency auditor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Waizusora/Wicofe-Tools
          ref: 12459e5365f696cda0ab47b5a107f3d8cb371679
          path: Wicofe-Tools

      - name: Install nested compositor system dependencies
        id: install-system-deps
        run: |
          mkdir -p target/ci-audit
          dpkg-query -W -f='${binary:Package}\t${Version}\n' | sort > target/ci-audit/packages.before.tsv
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev
          dpkg-query -W -f='${binary:Package}\t${Version}\n' | sort > target/ci-audit/packages.after.tsv
          python3 - <<'PY'
          from pathlib import Path
          def read(path):
              return dict(line.rstrip().split("\t", 1) for line in Path(path).read_text().splitlines() if "\t" in line)
          before = read("target/ci-audit/packages.before.tsv")
          after = read("target/ci-audit/packages.after.tsv")
          with Path("target/ci-audit/packages.changed.tsv").open("w") as out:
              for name, version in sorted(after.items()):
                  if before.get(name) != version:
                      out.write(f"{name}\t{before.get(name, 'NEW')}\t{version}\n")
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned action source
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Audit installed system package licenses
        if: always() && steps.install-system-deps.outcome == 'success'
        run: |
          python3 Wicofe-Tools/scripts/audit_dpkg_packages.py \
            --packages target/ci-audit/packages.changed.tsv \
            --repository WDE \
            --json target/ci-audit/system-packages.json \
            --markdown target/ci-audit/system-packages.md

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check default workspace
        run: cargo check --workspace --all-targets

      - name: Check nested compositor feature
        run: cargo check -p wde-compositor --features nested-winit --bin wde-nested

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Upload WDE build environment license evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wde-build-environment-evidence
          path: target/ci-audit/
          if-no-files-found: warn
